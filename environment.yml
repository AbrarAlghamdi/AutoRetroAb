name: autoretroab
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - numpy<1.24
  - pandas
  - pyyaml
  - snakemake>=8
  - snakemake-executor-plugin-slurm
  - stopit
  - bowtie2
  - samtools
  - sra-tools=3.2.1
  - wget
  - r-base
  - bioconductor-deseq2
  - telescope
  - pip
